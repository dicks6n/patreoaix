<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · PATREOAIX</title>
<style>
  :root { --bg:#0b0e14; --card:#121722; --text:#e6e9ef; --muted:#8a93a6; --accent:#f0b90b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:40px 16px 64px; }
  a { color:var(--accent); }
  h1 { font-size:30px; margin:0 0 4px; }
  h2 { font-size:19px; margin:32px 0 6px; }
  .muted { color:var(--muted); font-size:14px; }
  .brand { font-weight:800; font-size:20px; text-decoration:none; color:var(--text); }
  .brand span { color:var(--accent); }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; }
  li { margin:4px 0; }
</style>
</head>
<body>
<main>
  <header><a class="brand" href="/">PATREO<span>AIX</span></a><span class="muted"><a href="{% url 'privacy' %}">Privacy</a> · <a href="{% url 'terms' %}">Terms</a></span></header>
  {% block body %}{% endblock %}
  <p class="muted" style="margin-top:40px">Questions: <a href="mailto:{{ contact }}">{{ contact }}</a></p>
</main>
</body>
</html>
