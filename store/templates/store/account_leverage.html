{% extends 'base_dashboard.html' %}

{% block title %}Change Account Leverage - PATREOAIX{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-6 px-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <div class="mb-5 pb-4 border-b border-slate-800">
            <h2 class="text-xl font-bold text-white tracking-wide">Change Account Leverage</h2>
            <p class="text-xs text-slate-400 mt-0.5">Select your preferred leverage ratio for trade execution</p>
        </div>
        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}
            <div>
                <label for="leverage" class="block text-slate-400 font-bold uppercase mb-1.5">Select New Leverage</label>
                <select name="leverage" id="leverage" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono focus:outline-none focus:border-indigo-500 cursor-pointer" required>
                    <option value="100">1:100</option>
                    <option value="200">1:200</option>
                    <option value="500">1:500</option>
                    <option value="1000">1:1000</option>
                </select>
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow-lg cursor-pointer">
                Update Leverage
            </button>
        </form>
    </div>
</div>
{% endblock %}
