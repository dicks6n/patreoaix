{% extends 'base_dashboard.html' %}

{% block title %}Crypto Wallet - PATREOAIX{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-6 px-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-800">
            <div>
                <h2 class="text-xl font-bold text-white tracking-wide">Crypto Wallet</h2>
                <p class="text-xs text-slate-400 mt-0.5">Manage your digital asset balances and transactions</p>
            </div>
            <div class="flex items-center gap-2">
                <a href="{% url 'crypto_deposit' %}" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition shadow flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-arrow-down text-[11px]"></i> Deposit
                </a>
                <a href="{% url 'crypto_withdrawal' %}" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-arrow-up text-[11px]"></i> Withdraw
                </a>
            </div>
        </div>

        <div class="space-y-4">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono">Balances</h3>
            <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
                <div class="divide-y divide-slate-800/80 font-mono text-xs">
                    <div class="p-4 flex items-center justify-between hover:bg-slate-800/40 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 font-bold">
                                <i class="fa-brands fa-bitcoin"></i>
                            </div>
                            <span class="font-sans font-bold text-white text-sm">Bitcoin (BTC)</span>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-slate-900 text-slate-300 border border-slate-800">0.00 BTC</span>
                    </div>
                    <div class="p-4 flex items-center justify-between hover:bg-slate-800/40 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold">
                                <i class="fa-solid fa-t"></i>
                            </div>
                            <span class="font-sans font-bold text-white text-sm">Tether (USDT)</span>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
