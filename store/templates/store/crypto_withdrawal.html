{% extends 'base_dashboard.html' %}

{% block title %}Cryptocurrency Withdrawal - PATREOAIX{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-6 px-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <div class="mb-5 pb-4 border-b border-slate-800">
            <h2 class="text-xl font-bold text-white tracking-wide">Cryptocurrency Withdrawal</h2>
            <p class="text-xs text-slate-400 mt-0.5">Withdraw funds securely to your external crypto wallet</p>
        </div>
        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}
            <div>
                <label for="currency" class="block text-slate-400 font-bold uppercase mb-1.5">Select Currency</label>
                <select name="currency" id="currency" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono focus:outline-none focus:border-indigo-500 cursor-pointer" required>
                    <option value="USDT">Tether (USDT TRC20)</option>
                    <option value="BTC">Bitcoin (BTC)</option>
                </select>
            </div>
            <div>
                <label for="amount" class="block text-slate-400 font-bold uppercase mb-1.5">Amount (USD Equivalent)</label>
                <input type="number" name="amount" id="amount" placeholder="0.00" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono focus:outline-none focus:border-indigo-500" required>
            </div>
            <div>
                <label for="wallet_address" class="block text-slate-400 font-bold uppercase mb-1.5">Destination Wallet Address</label>
                <input type="text" name="wallet_address" id="wallet_address" placeholder="Enter destination wallet address" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono focus:outline-none focus:border-indigo-500" required>
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow-lg cursor-pointer">
                Request Withdrawal
            </button>
        </form>
    </div>
</div>
{% endblock %}
