<div id="pxCookie" role="region" aria-label="Cookie notice" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:95;max-width:560px;margin:0 auto;background:#141821;color:#e8ecf3;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 16px;box-shadow:0 14px 44px rgba(0,0,0,.45);font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <div style="display:flex;gap:12px;align-items:flex-start">
        <span style="font-size:20px;line-height:1" aria-hidden="true">🍪</span>
        <div style="flex:1;min-width:0">
            <b style="display:block;font-size:14px;margin-bottom:2px">Cookies on PATREOAIX</b>
            We only use essential cookies (sign-in, security) and settings you choose, like your theme. <b>No ads or tracking.</b>
            <a href="/cookies/" style="color:#f5b301;text-decoration:underline">Cookie policy</a> · <a href="/privacy/" style="color:#f5b301;text-decoration:underline">Privacy</a>
        </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px">
        <button type="button" id="pxCookieOk" style="background:#f5b301;color:#0b0e14;border:0;border-radius:10px;padding:9px 18px;font-weight:800;font-size:13px;cursor:pointer">Got it</button>
    </div>
</div>
<script>
(function () {
    var box = document.getElementById('pxCookie');
    function seen() { return /(?:^|;\s*)px_consent=/.test(document.cookie); }
    window.pxCookies = { open: function () { box.style.display = 'block'; } };
    document.getElementById('pxCookieOk').addEventListener('click', function () {
        document.cookie = 'px_consent=essential; path=/; max-age=31536000; samesite=lax' + (location.protocol === 'https:' ? '; secure' : '');
        box.style.display = 'none';
    });
    if (!seen()) setTimeout(function () { box.style.display = 'block'; }, 1200);
})();
</script>
